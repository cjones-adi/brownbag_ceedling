# =========================================================================
#   Ceedling - Test-Centered Build System for C
#   simple-led-control -- Demo 1 "Simple Start" reference project
#
#   Intentionally minimal:
#     - NO mocks (:use_mocks: FALSE)
#     - NO CMock configuration
#     - NO board-specific defines
#   This project compiles and runs entirely on the host with Unity only.
# =========================================================================
---
:project:
  :which_ceedling: gem
  :ceedling_version: 1.0.1
  :use_mocks: FALSE
  :use_test_preprocessor: :all
  :use_deep_preprocessor: :none
  :use_backtrace: :none
  :use_decorators: :auto
  :build_root: build
  :test_file_prefix: test_
  :default_tasks:
    - test:all
  :test_threads: 8
  :compile_threads: 8
  :release_build: FALSE

:mixins:
  :enabled: []
  :load_paths: []

:test_build:
  :use_assembly: FALSE

:release_build:
  :output: simple_led_control.out
  :use_assembly: FALSE
  :artifacts: []

:plugins:
  :load_paths: []
  :enabled:
    - report_tests_pretty_stdout

:extension:
  :executable: .out

:paths:
  :test:
    - +:test/**
    - -:test/support
  :source:
    - src/**
  :include:
    - src/**
  :support:
    - test/support
  :libraries: []

:files:
  :test: []
  :source: []

:defines:
  :test:
    - TEST
  :use_test_definition: FALSE

:unity:
  :defines:
    - UNITY_EXCLUDE_FLOAT

:libraries:
  :placement: :end
  :flag: "-l${1}"
  :path_flag: "-L ${1}"
  :system: []
  :test: []
  :release: []
