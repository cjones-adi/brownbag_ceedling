---
:project:
  :which_ceedling: gem
  :ceedling_version: 1.0.1

  :use_mocks: TRUE
  :use_test_preprocessor: :all   # needed so #ifdef in test files tracks the toggle
  :use_deep_preprocessor: :none
  :use_backtrace: :none
  :use_decorators: :auto

  :build_root: build
  :test_file_prefix: test_
  :default_tasks:
    - test:all

  :test_threads: 8
  :compile_threads: 8

  :release_build: FALSE

:mixins:
  :enabled: []
  :load_paths: []

:test_build:
  :use_assembly: FALSE

:release_build:
  :output: my_project.out
  :use_assembly: FALSE
  :artifacts: []

:plugins:
  :load_paths: []
  :enabled:
    - module_generator
    - gcov
    - report_tests_log_factory
    - report_tests_pretty_stdout

:report_tests_log_factory:
  :reports:
    - json
    - junit
    - cppunit
    - html

:extension:
  :executable: .out

:paths:
  :test:
    - +:test/**
    - -:test/support
  :source:
    - src/**
  :include:
    - src/**
  :support:
    - test/support
  :libraries: []

:files:
  :test: []
  :source: []

:defines:
  :test:
    - TEST
    - TARGET_NUM=32655
    - TARGET=MAX32655
    - TARGET_REV=0x4131
  :release:
    - TARGET_NUM=32655
    - TARGET=MAX32655
    - TARGET_REV=0x4131
  :use_test_definition: FALSE

:cmock:
  :plugins:
    - :ignore
    - :callback
  :verbosity: 2
  :when_no_prototypes: :warn
  :skeleton_path: ''
  :mock_prefix: 'mock_'
  :mock_suffix: ''
  :strippables:
    - '(?:__attribute__\s*\([ (]*.*?[ )]*\)+)'
  :attributes:
    - __ramfunc
    - __irq
    - __fiq
    - register
    - extern
  :c_calling_conventions:
    - __stdcall
    - __cdecl
    - __fastcall
  :treat_externs: :exclude
  :treat_inlines: :exclude
  :treat_as:
    uint8:  HEX8
    uint16: HEX16
    uint32: UINT32
    int8:   INT8
    bool:   UINT8
  :memcmp_if_unknown: true
  :when_ptr: :compare_data
  :weak: ''
  :enforce_strict_ordering: true
  :fail_on_unexpected_calls: true
  :callback_include_count: true
  :callback_after_arg_check: false
  :exclude_setjmp_h: false

:unity:
  :defines:
    - UNITY_EXCLUDE_FLOAT

:environment:
  - :path:
    - C:/Ruby40-x64/msys64/ucrt64/bin
    - C:/Users/CJones7/AppData/Local/Packages/PythonSoftwareFoundation.Python.3.13_qbz5n2kfra8p0/LocalCache/local-packages/Python313/Scripts
    - "#{ENV['PATH']}"

:libraries:
  :placement: :end
  :flag: "-l${1}"
  :path_flag: "-L ${1}"
  :system: []
  :test: []
  :release: []

:gcov:
  :summaries: TRUE
  :report_task: FALSE
  :utilities:
    - gcovr
  :reports:
    - HtmlDetailed
  :gcovr:
    :html_medium_threshold: 75
    :html_high_threshold: 90
    :report_include: "src/*"
